<!doctype html>
<html lang="en">
  <head>
    <!-- fx-scaffold -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이음 - 아이 지원 찾기와 기록 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="/src/fx-tailwind.css" />
    <style id="fx-tokens">:root {
  --fx-color-background: #19191f;
  --fx-color-surface: #27272d;
  --fx-color-text: #f6faff;
  --fx-color-text-muted: #a9abae;
  --fx-color-border: #4c4d52;
  --fx-color-overlay: rgba(0, 0, 0, 0.5);
  --fx-color-primary: #7a6bff;
  --fx-color-on-primary: #ffffff;
  --fx-color-success: #6fcf7f;
  --fx-color-warning: #f2c14e;
  --fx-color-error: #e2827b;
  --fx-color-info: #6aa9ff;
  --fx-color-accent: #c0e740;
  --fx-color-accent-soft: #373e25;
  --fx-color-data-1: #7a6bff;
  --fx-color-data-2: #e77540;
  --fx-color-data-3: #c0e740;
  --fx-color-data-4: #6aa9ff;
  --fx-color-data-5: #6fcf7f;
  --fx-color-data-6: #f2c14e;
  --fx-color-primary-soft: #2a2847;
  --fx-color-secondary: #e77540;
  --fx-color-secondary-soft: #3e2a25;
  --fx-radius-sm: 4px;
  --fx-radius-md: 8px;
  --fx-radius-lg: 12px;
  --fx-radius-pill: 9999px;
  --fx-space-xs: 4px;
  --fx-space-sm: 8px;
  --fx-space-md: 16px;
  --fx-space-lg: 24px;
  --fx-space-xl: 40px;
  --fx-space-section: 96px;
  --fx-space-1: 4px;
  --fx-space-2: 8px;
  --fx-space-3: 12px;
  --fx-space-4: 16px;
  --fx-space-5: 20px;
  --fx-space-6: 24px;
  --fx-space-8: 32px;
  --fx-space-10: 40px;
  --fx-space-12: 48px;
  --fx-space-16: 64px;
  --fx-space-20: 80px;
  --fx-space-24: 96px;
  --fx-font-description: var(--app-font, 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif);
  --fx-font-plain: var(--app-font, 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif);
  --fx-font-title: var(--app-font, 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif);
  word-break: keep-all;
}
.fx-type-display { font-family: var(--fx-font-title), sans-serif; font-size: 48px; font-weight: 700; line-height: 48px; letter-spacing: -1px; }
.fx-type-heading { font-family: var(--fx-font-title), sans-serif; font-size: 30px; font-weight: 600; line-height: 36px; letter-spacing: -0.4px; }
.fx-type-title { font-family: var(--fx-font-title), sans-serif; font-size: 20px; font-weight: 600; line-height: 28px; }
.fx-type-body { font-family: var(--fx-font-plain), sans-serif; font-size: 16px; font-weight: 400; line-height: 24px; }
.fx-type-body-sm { font-family: var(--fx-font-plain), sans-serif; font-size: 14px; font-weight: 400; line-height: 20px; }
.fx-type-caption { font-family: var(--fx-font-description), sans-serif; font-size: 12px; font-weight: 400; line-height: 16px; }
.fx-type-button { font-family: var(--fx-font-plain), sans-serif; font-size: 14px; font-weight: 500; line-height: 1; }
.fx-type-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 400; line-height: 20px; font-variant-numeric: tabular-nums; }
.fx-button-primary { background-color: var(--fx-color-primary); color: var(--fx-color-on-primary); border-radius: var(--fx-radius-md); padding: 8px 16px; white-space: nowrap; }
.fx-button-secondary { background-color: var(--fx-color-surface); color: var(--fx-color-text); border: 1px solid var(--fx-color-border); border-radius: var(--fx-radius-md); padding: 8px 16px; white-space: nowrap; }
.fx-input { background-color: var(--fx-color-surface); color: var(--fx-color-text); border: 1px solid var(--fx-color-border); border-radius: var(--fx-radius-md); padding: 8px 12px; }
.fx-card { background-color: var(--fx-color-surface); color: var(--fx-color-text); border: 1px solid var(--fx-color-border); border-radius: var(--fx-radius-lg); padding: 24px; }
.fx-link { color: var(--fx-color-primary); }
html { background-color: var(--fx-color-background); color: var(--fx-color-text); color-scheme: dark; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
