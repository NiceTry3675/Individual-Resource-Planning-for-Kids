<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이음 다이어그램</title>
<!--FONT--><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap"><!--/FONT-->
<style>
  /* 발표 자료(이음_발표대본.pptx)와 같은 색과 자리: 글자 1F1F1F, 파랑 0F7FB7, 회색 6B6B6B, 주황 FC5C15 */
  :root {
    --ink: #1F1F1F; --sub: #4A4F55; --gray: #6B6B6B; --hair: #D7DCE1;
    --blue: #0F7FB7; --blue-t: #EEF6FB;
    --orange: #FC5C15; --orange-d: #E5520F; --orange-t: #FFF4EE;
    --violet: #6A4FD0; --violet-t: #F4F1FD;
    --ext: #5E6670; --ext-t: #F4F5F7;
    --band: #F5F7F9;
  }
  html, body { margin: 0; background: #fff; }
  body { font-family: 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  @page { size: 1920px 1080px; margin: 0; }
  .frame { width: 1920px; height: 1080px; overflow: hidden; break-after: page; }
  .frame:last-child { break-after: auto; }
  .stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff; color: var(--ink); letter-spacing: -0.015em; }
  @media print { body.all { padding: 0; background: #fff; } .frame { transform: none !important; margin: 0 !important; box-shadow: none !important; } }
  @media screen { body.all { background: #E9ECEF; padding: 24px 0; } body.all .frame { box-shadow: 0 2px 12px rgba(0,0,0,.08); transform-origin: top left; } }

  .section { position: absolute; left: 104px; top: 40px; font-size: 27px; font-weight: 700; color: var(--blue); }
  .title { position: absolute; left: 104px; top: 92px; font-size: 58px; font-weight: 800; letter-spacing: -0.03em; display: flex; align-items: center; gap: 18px; line-height: 1.2; }
  .title .num { width: 60px; height: 60px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .subtitle { position: absolute; left: 104px; top: 184px; font-size: 29px; font-weight: 500; color: var(--sub); }

  .legend { position: absolute; right: 80px; top: 48px; display: grid; grid-template-columns: auto auto; gap: 12px 28px; font-size: 22px; color: var(--sub); }
  .legend .it { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .legend .sw { width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; }
  .legend .sw.dash { border-radius: 6px; border: 2.5px dashed var(--ext); background: #fff; }

  .phase { position: absolute; top: 284px; height: 44px; }
  .phase .lb { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 27px; font-weight: 800; }
  .phase .br { position: absolute; left: 12px; right: 12px; top: 42px; height: 10px; border: 2.5px solid; border-bottom: none; border-radius: 8px 8px 0 0; }

  /* 상자: 아이콘 + 제목 + 짧은 한 줄 */
  .node { position: absolute; box-sizing: border-box; border: 2.5px solid; border-radius: 20px; padding: 20px 14px 22px; background: #fff; text-align: center; }
  .node.dash { border-style: dashed; }
  .node .ic { width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; color: #fff; }
  .node .ic svg { width: 38px; height: 38px; }
  .node .t { font-size: 30px; font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; white-space: nowrap; }
  .node .b { font-size: 23px; font-weight: 500; line-height: 1.35; color: var(--sub); margin-top: 6px; white-space: nowrap; }
  .node .b b { color: var(--ink); font-weight: 800; }
  /* 가로형: 아이콘 왼쪽, 글자 오른쪽 */
  .node.row { display: flex; align-items: center; gap: 16px; text-align: left; padding: 16px 20px; }
  .node.row .ic { width: 60px; height: 60px; margin: 0; flex: none; }
  .node.row .ic svg { width: 32px; height: 32px; }
  .node.row .tx { min-width: 0; flex: none; }
  /* 서비스 로고는 흰 타일에 원래 색 그대로 */
  .node .ic.brand { background: #fff; border: 2px solid var(--hair); box-sizing: border-box; }
  .node .ic.brand svg, .node .ic.brand img { width: 40px; height: 40px; }
  .node.row .ic.brand svg, .node.row .ic.brand img { width: 36px; height: 36px; }
  .node .ic.brand img { width: 50px; height: 50px; }
  .ib svg, .ib img { width: 22px; height: 22px; vertical-align: -4px; margin-right: 6px; }
  .group .gt .ib svg { width: 28px; height: 28px; vertical-align: -3px; margin-right: 12px; }
  .node.row .t { font-size: 28px; }
  .node.row .b { font-size: 22px; margin-top: 2px; }
  /* 파이프라인 작은 상자 */
  .node.mini { padding: 14px 6px 14px; }
  .node.mini .ic { width: 50px; height: 50px; margin-bottom: 8px; }
  .node.mini .ic svg { width: 27px; height: 27px; }
  .node.mini .t { font-size: 25px; }

  .k-parent { border-color: var(--orange); background: var(--orange-t); } .k-parent .ic, .legend .k-parent { background: var(--orange-d); }
  .k-llm { border-color: var(--violet); background: var(--violet-t); } .k-llm .ic, .legend .k-llm { background: var(--violet); }
  .k-code { border-color: var(--blue); background: var(--blue-t); } .k-code .ic, .legend .k-code { background: var(--blue); }
  .k-ext { border-color: var(--ext); background: var(--ext-t); } .k-ext .ic, .legend .k-ext { background: var(--ext); }
  .k-plain { border-color: #AEB6BF; background: #fff; } .k-plain .ic { background: var(--gray); }

  .group { position: absolute; box-sizing: border-box; border: 3px solid var(--blue); border-radius: 24px; background: #FAFCFE; }
  .group .gt { position: absolute; left: 28px; top: 18px; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; }
  .group .gs { position: absolute; left: 28px; top: 64px; font-size: 22px; font-weight: 500; color: var(--sub); white-space: nowrap; }
  .glabel { position: absolute; text-align: center; font-size: 22px; font-weight: 800; color: var(--sub); }

  .gate { position: absolute; top: 370px; width: 0; border-left: 3px dashed var(--orange); }
  .gate .lb { position: absolute; top: -12px; left: -130px; width: 260px; text-align: center; font-size: 23px; font-weight: 800; color: var(--orange); background: #fff; padding: 2px 0 4px; }

  .footer { position: absolute; left: 80px; right: 80px; top: 930px; height: 108px; border-radius: 18px; background: var(--band); display: flex; align-items: center; padding: 0 40px; box-sizing: border-box; gap: 38px; }
  .footer .counter { display: flex; align-items: baseline; gap: 16px; white-space: nowrap; }
  .footer .counter .from { font-size: 29px; font-weight: 700; color: var(--gray); text-decoration: line-through; text-decoration-thickness: 2px; }
  .footer .counter .arrow { font-size: 30px; font-weight: 800; color: var(--gray); }
  .footer .counter .to { font-size: 42px; font-weight: 900; color: var(--orange); letter-spacing: -0.03em; }
  .footer .sep { width: 2px; align-self: stretch; margin: 26px 0; background: var(--hair); }
  .footer .rules { flex: 1; display: flex; justify-content: space-evenly; gap: 34px; font-size: 26px; font-weight: 600; color: var(--sub); }
  .footer .rules span { white-space: nowrap; }
  .footer .rules i { font-style: normal; font-weight: 800; color: var(--ink); }
  .footer.only .rules { justify-content: space-between; font-size: 27px; }

  svg.wires { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
  .elabel { position: absolute; transform: translate(-50%, -50%); font-size: 22px; font-weight: 700; color: var(--sub); background: #fff; padding: 1px 8px 2px; border-radius: 6px; white-space: nowrap; }
  /* 묶음 배경 위에 선, 선 위에 상자와 라벨 */
  .group { z-index: 0; } svg.wires { z-index: 1; } .node, .glabel, .gate { z-index: 2; } .elabel { z-index: 3; }
  #report { display: none; }
</style>

function el(tag, cls, html, parent) {

}
function place(e, x, y, w, h) {

  if (w != null) e.style.width = w + 'px';
  if (h != null) e.style.height = h + 'px';
}
function rectOf(e) {

  return { l, t, r: l + w, b: t + h, cx: l + w / 2, cy: t + h / 2, w, h };
}

}

function node(stage, n, x, w) {
  const cls = ['node', 'k-' + n.kind, n.dash && 'dash', n.row && 'row', n.mini && 'mini'].filter(Boolean).join(' ');
  const e = el('div', cls, '', stage);

function wirePath(a, b, mode, opt = {}) {
  const r = 12;
  if (mode === 'v') {
    const x = (Math.max(a.l, b.l) + Math.min(a.r, b.r)) / 2;
    return { d: `M${x},${a.b} V${b.t - 3}`, lx: x, ly: (a.b + b.t) / 2 };
  }
  const x1 = a.r, y1 = opt.y1 != null ? opt.y1 : a.cy, x2 = b.l, y2 = opt.y2 != null ? opt.y2 : b.cy;
  if (Math.abs(y1 - y2) < 1) return { d: `M${x1},${y1} H${x2 - 3}`, lx: (x1 + x2) / 2, ly: y1 };
  const mx = opt.mx != null ? opt.mx : (x1 + x2) / 2, s = y2 > y1 ? 1 : -1;
  return {
    d: `M${x1},${y1} H${mx - r} Q${mx},${y1} ${mx},${y1 + s * r} V${y2 - s * r} Q${mx},${y2} ${mx + r},${y2} H${x2 - 3}`,
    lx: mx, ly: (y1 + y2) / 2,
  };
}

  if (d.counter) {
    const c = el('div', 'counter', '', f);
    el('span', 'from', d.counter[0], c);
    el('span', 'arrow', '→', c);
    el('span', 'to', d.counter[1], c);
    el('div', 'sep', '', f);
  }
  const r = el('div', 'rules', '', f);
  for (const t of d.rules) el('span', '', t, r);
}

function renderFlow(stage, d) {
  header(stage, d, 'Ⅱ. 솔루션 · 에이전트 흐름', true);
  for (const [text, c0, c1, color] of d.phases) {
    const p = el('div', 'phase', '', stage);
    place(p, X0 + c0 * COLW, null, (c1 - c0 + 1) * COLW);
    el('div', 'lb', text, p).style.color = `var(--${color})`;
    el('div', 'br', '', p).style.borderColor = `var(--${color})`;
  }
  const byId = {};
  for (const n of d.nodes) {
    const e = node(stage, n, colX(n.col), BOXW);
    e.style.top = Math.round(n.cy - e.offsetHeight / 2) + 'px';
    byId[n.id] = e;
  }
  const g = el('div', 'gate', '', stage);
  place(g, gapX(5), null, null, d.gateH || 530);
  el('div', 'lb', '승인한 것만 밖으로', g);
  drawEdges(stage, d.edges, byId);
  footer(stage, d);
}

// ── 서비스 아키텍처 ─────────────────────────────────────────
function renderArch(stage) {
  header(stage, {
    title: '서비스 아키텍처',
    sub: '화면은 플렉스튜디오, 판단과 데이터는 에이전트 서버 한 곳에',
  }, 'Ⅱ. 솔루션 · 시스템 구성', false);

  const byId = {};
  const put = (n, x, cy, w) => {
    const e = node(stage, n, x, w);
    e.style.top = Math.round(cy - e.offsetHeight / 2) + 'px';
    byId[n.id] = e;
    return e;
  };
  const R = (id) => rectOf(byId[id]);

  // 에이전트 서버 묶음
  const G = { l: 760, t: 268, w: 720 };
  const g = el('div', 'group', '', stage);
  place(g, G.l, G.t, G.w, 600);
  el('div', 'gt', withBrands('{vercel}에이전트 서버'), g);
  el('div', 'gs', 'Vercel 서버리스 · 서울', g);
  const IX = G.l + 28, IW = G.w - 56;

  const api = node(stage, { id: 'api', kind: 'code', row: 1, icon: 'plug', t: '조회·쓰기 API', b: 'HTTPS · CORS · 서버 키' }, IX, IW);
  api.style.top = (G.t + 108) + 'px';
  byId.api = api;

  const PT = R('api').b + 90;
  place(el('div', 'glabel', '처리 파이프라인', stage), G.l, PT - 42, G.w);
  const steps = [
    ['s1', 'code', 'inbox', '받기'], ['s2', 'llm', 'sparkles', '해석'], ['s3', 'code', 'calculator', '판정'],
    ['s4', 'llm', 'pen-line', '작성'], ['s5', 'parent', 'circle-check', '승인'],
  ];
  const sw = 112, sg = (IW - sw * steps.length) / (steps.length - 1);
  steps.forEach(([id, kind, icon, t], i) => {
    const e = node(stage, { id, kind, icon, t, mini: 1 }, IX + i * (sw + sg), sw);
    e.style.top = PT + 'px';
    byId[id] = e;
  });

  const out = node(stage, { id: 'out', kind: 'code', row: 1, icon: 'send', t: '내보내기', b: '문자·메일·공유 링크' }, IX, 400);
  out.style.top = (R('s1').b + 34) + 'px';
  byId.out = out;
  g.style.height = (R('out').b + 28 - G.t) + 'px';

  // 왼쪽: 사람·화면·공고, 오른쪽: 데이터와 AI 모델. 이어지는 단계와 같은 높이에 둔다.
  const apiR = R('api'), s1 = R('s1'), outR = R('out');
  put({ id: 'parent', kind: 'parent', icon: 'smartphone', t: '부모', b: '휴대폰 브라우저' }, 80, apiR.cy, 220);
  put({ id: 'app', kind: 'plain', brand: 'flextudio', t: '플렉스튜디오 앱', b: '{react}React 화면' }, 360, apiR.cy, 250);
  put({ id: 'src', kind: 'ext', row: 1, icon: 'megaphone', t: '지원 공고', b: '공공데이터·구청' }, 360, s1.cy, 280);
  put({ id: 'org', kind: 'ext', icon: 'building-2', t: '기관', b: '센터·학교·복지관' }, 80, outR.cy, 220);
  const RX = 1560, RW = 280;
  put({ id: 'db', kind: 'code', row: 1, brand: 'azuresql', t: 'Azure SQL', b: '테이블 12 · 뷰 10' }, RX, apiR.cy, RW);
  put({ id: 'llm', kind: 'llm', row: 1, brand: 'openai', t: 'OpenAI', b: '해석·작성만' }, RX, PT - 24, RW);
  put({ id: 'files', kind: 'code', row: 1, icon: 'folder', t: '파일 저장소', b: '서류·사진 원본' }, RX, outR.cy, RW);

  const parent = R('parent'), app = R('app'), src = R('src'), org = R('org'), gR = G.l + G.w;
  const db = R('db'), llm = R('llm'), files = R('files');

  stroke(stage, `M${parent.r + 3},${parent.cy} H${app.l - 3}`, { both: 1 });
  stroke(stage, `M${app.r + 3},${apiR.cy} H${apiR.l - 3}`, { both: 1, color: 'blue' });
  label(stage, 'API 호출', (app.r + G.l) / 2, apiR.cy - 30);
  stroke(stage, `M${src.r + 3},${s1.cy} H${s1.l - 3}`);
  label(stage, '수집', (src.r + G.l) / 2, s1.cy - 30);
  stroke(stage, `M${outR.l - 3},${outR.cy} H${org.r + 3}`, { color: 'orange' });
  label(stage, '승인한 것만', (org.r + G.l) / 2, outR.cy - 30);

  stroke(stage, `M${gR + 3},${db.cy} H${db.l - 3}`, { both: 1, color: 'blue' });
  stroke(stage, `M${gR + 3},${llm.cy} H${llm.l - 3}`, { both: 1 });
  stroke(stage, `M${gR + 3},${files.cy} H${files.l - 3}`, { both: 1, color: 'blue' });

  for (let i = 1; i <= 4; i++) {
    const a = R('s' + i), b = R('s' + (i + 1));
    stroke(stage, `M${a.r + 2},${a.cy} H${b.l - 3}`);
  }
  const s5 = R('s5'), turn = s5.b + (outR.t - s5.b) / 2, ox = outR.r - 70;
  stroke(stage, `M${s5.cx},${s5.b + 2} V${turn - 10} Q${s5.cx},${turn} ${s5.cx - 10},${turn} H${ox + 10} Q${ox},${turn} ${ox},${turn + 10} V${outR.t - 3}`, { color: 'orange' });

  footer(stage, {
    rules: ['DB에는 <i>서버만</i> 접속', '판단은 <i>코드</i>, 글은 <i>AI</i>', '밖으로는 <i>승인 뒤에만</i>'],
  });
}

const ORDER = ['ledger', 'radar', 'resume', 'arch'];
function renderOne(key) {
  const frame = el('div', 'frame', '', document.body);
  const stage = el('div', 'stage', '', frame);
  stage.dataset.key = key;
  if (key === 'arch') renderArch(stage); else renderFlow(stage, FLOW[key]);
  return stage;
}

// 넘친 글자, 겹친 상자, 화면 밖 상자를 찾아 #report에 적는다(렌더 점검용).
function check(stage) {
  const out = [];
  const key = stage.dataset.key;
  for (const n of stage.querySelectorAll('.node, .footer, .legend, .title, .subtitle, .group')) {
    const r = rectOf(n), id = n.dataset.id || n.className;
    if (r.l < 0 || r.r > 1920 || r.t < 0 || r.b > 1080) out.push(`${key}: out of stage ${id}`);
    if (n.classList.contains('node') && n.scrollWidth > n.clientWidth + 1) out.push(`${key}: overflow ${id} ${n.scrollWidth}>${n.clientWidth}`);
    for (const line of n.querySelectorAll('.t, .b, .rules span')) {
      const rg = document.createRange(); rg.selectNodeContents(line);
      const lr = rg.getBoundingClientRect(), nr = n.getBoundingClientRect();
      const pad = n.classList.contains('footer') ? 0 : n.classList.contains('mini') ? 4 : 12;
      if (lr.right > nr.right - pad + 0.5 || lr.left < nr.left + pad - 0.5) out.push(`${key}: text past edge ${id} "${line.textContent}"`);
    }
  }
  const boxes = [...stage.querySelectorAll('.node, .footer')].map((n) => [n, rectOf(n)]);
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const [na, a] = boxes[i], [nb, b] = boxes[j];
    if (a.l < b.r + 8 && b.l < a.r + 8 && a.t < b.b + 8 && b.t < a.b + 8) out.push(`${key}: too close ${na.dataset.id || na.className} × ${nb.dataset.id || nb.className}`);
  }
  for (const l of stage.querySelectorAll('.elabel')) {
    const lr = rectOf(l);
    const L = { l: lr.l - lr.w / 2, r: lr.l + lr.w / 2, t: lr.t - lr.h / 2, b: lr.t + lr.h / 2 };
    for (const [n, b] of boxes) if (L.l < b.r && b.l < L.r && L.t < b.b && b.t < L.b) out.push(`${key}: label "${l.textContent}" hits ${n.dataset.id || n.className}`);
  }
  const lg = rectOf(stage.querySelector('.legend'));
  for (const sel of ['.subtitle', '.title']) {
    const r = rectOf(stage.querySelector(sel));
    if (r.r > lg.l - 24 && r.t < lg.b) out.push(`${key}: ${sel} hits legend (${r.r} vs ${lg.l})`);
  }
  return out;
}

function main() {
  const key = new URLSearchParams(location.search).get('d');
  const keys = key ? [key] : ORDER;
  if (!key) document.body.classList.add('all');
  const issues = [];
  for (const k of keys) issues.push(...check(renderOne(k)));
  document.getElementById('report').textContent = issues.length ? issues.join('\n') : 'OK';
  if (!key) {
    const fit = () => document.querySelectorAll('.frame').forEach((f) => {
      const s = Math.min(1, (innerWidth - 32) / 1920);
      f.style.transform = `scale(${s})`;
      f.style.margin = `0 0 ${24 - 1080 * (1 - s)}px ${(innerWidth - 1920 * s) / 2}px`;
    });
    fit();
    addEventListener('resize', fit);
  }
}
document.fonts.ready.then(main);
</script>
